<svg fill="none" viewBox="0 0 680 420" width="680" height="420" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>

        :root {
          --bg-outer-light: #eef2f9;
          --bg-outer-dark: #070b14;
          --bg-crt-light: #f8faff;
          --bg-crt-dark: #0b1020;
          --text-main-light: #0f172a;
          --text-main-dark: #e2e8f0;
          --text-muted-light: #475569;
          --text-muted-dark: #94a3b8;
          --border-frame-light: #cbd5e1;
          --border-frame-dark: #1e293b;
          --grid-line-light: rgba(15, 23, 42, 0.06);
          --grid-line-dark: rgba(56, 189, 248, 0.08);
          --cyan-accent-light: #0284c7;
          --cyan-accent-dark: #38bdf8;
          --magenta-accent-light: #c026d3;
          --magenta-accent-dark: #f472b6;
          --amber-accent-light: #d97706;
          --amber-accent-dark: #fbbf24;
          --danger-accent-light: #dc2626;
          --danger-accent-dark: #f87171;
          --emerald-accent-light: #059669;
          --emerald-accent-dark: #34d399;

          --bg-outer: var(--bg-outer-light);
          --bg-crt: var(--bg-crt-light);
          --text-main: var(--text-main-light);
          --text-muted: var(--text-muted-light);
          --border-frame: var(--border-frame-light);
          --grid-line: var(--grid-line-light);
          --cyan-accent: var(--cyan-accent-light);
          --magenta-accent: var(--magenta-accent-light);
          --amber-accent: var(--amber-accent-light);
          --danger-accent: var(--danger-accent-light);
          --emerald-accent: var(--emerald-accent-light);

          color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg-outer: var(--bg-outer-dark);
            --bg-crt: var(--bg-crt-dark);
            --text-main: var(--text-main-dark);
            --text-muted: var(--text-muted-dark);
            --border-frame: var(--border-frame-dark);
            --grid-line: var(--grid-line-dark);
            --cyan-accent: var(--cyan-accent-dark);
            --magenta-accent: var(--magenta-accent-dark);
            --amber-accent: var(--amber-accent-dark);
            --danger-accent: var(--danger-accent-dark);
            --emerald-accent: var(--emerald-accent-dark);
          }
        }
        @supports (color: light-dark(white, black)) {
          :root {
            --bg-outer: light-dark(var(--bg-outer-light), var(--bg-outer-dark));
            --bg-crt: light-dark(var(--bg-crt-light), var(--bg-crt-dark));
            --text-main: light-dark(var(--text-main-light), var(--text-main-dark));
            --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));
            --border-frame: light-dark(var(--border-frame-light), var(--border-frame-dark));
            --cyan-accent: light-dark(var(--cyan-accent-light), var(--cyan-accent-dark));
            --magenta-accent: light-dark(var(--magenta-accent-light), var(--magenta-accent-dark));
            --amber-accent: light-dark(var(--amber-accent-light), var(--amber-accent-dark));
            --danger-accent: light-dark(var(--danger-accent-light), var(--danger-accent-dark));
            --emerald-accent: light-dark(var(--emerald-accent-light), var(--emerald-accent-dark));
          }
        }
        @media (forced-colors: active) {
          .cabinet, .brick, .paddle, .ball, .hud-pill {
            forced-color-adjust: none;
          }
        }
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .cabinet {
          width: 680px;
          height: 420px;
          background: var(--bg-outer);
          color: var(--text-main);
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
          border: 2px solid var(--border-frame);
          border-radius: 14px;
          position: relative;
          overflow: hidden;
          user-select: none;
        }
        .crt {
          position: absolute;
          inset: 8px;
          background:
            linear-gradient(to right, var(--grid-line) 1px, transparent 1px) 0 0 / 24px 24px,
            linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px) 0 0 / 24px 24px,
            var(--bg-crt);
          border: 1px solid var(--border-frame);
          border-radius: 10px;
          overflow: hidden;
        }
        .scanlines {
          position: absolute;
          inset: 0;
          background: repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 2px,
            rgba(0, 0, 0, 0.07) 3px,
            rgba(0, 0, 0, 0.07) 4px
          );
          pointer-events: none;
          z-index: 30;
        }
        .hud {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 44px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
          border-bottom: 1px solid var(--border-frame);
          background: rgba(15, 23, 42, 0.06);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.06em;
          z-index: 20;
        }
        .hud-group {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .hud-pill {
          padding: 3px 8px;
          border-radius: 6px;
          border: 1px solid var(--border-frame);
          background: var(--bg-outer);
          color: var(--text-main);
        }
        .hud-score-wrap {
          position: relative;
          display: inline-block;
          min-width: 112px;
          height: 22px;
          vertical-align: middle;
        }
        .score-before, .score-after {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          color: var(--cyan-accent);
        }
        .score-before {
          animation: scoreSwapBefore 4s infinite steps(1, end);
        }
        .score-after {
          animation: scoreSwapAfter 4s infinite steps(1, end);
        }
        @keyframes scoreSwapBefore {
          0%, 42% { opacity: 1; }
          42.01%, 100% { opacity: 0; }
        }
        @keyframes scoreSwapAfter {
          0%, 42% { opacity: 0; }
          42.01%, 100% { opacity: 1; }
        }
        .wall-left, .wall-right {
          position: absolute;
          top: 44px;
          bottom: 28px;
          width: 6px;
          background: linear-gradient(180deg, var(--cyan-accent), var(--magenta-accent));
          opacity: 0.45;
        }
        .wall-left { left: 16px; border-radius: 3px; }
        .wall-right { right: 16px; border-radius: 3px; }
        .brick {
          position: absolute;
          border-radius: 5px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 10px;
          font-weight: 800;
          letter-spacing: 0.05em;
          border: 1.5px solid rgba(255, 255, 255, 0.35);
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
          z-index: 8;
        }
        .brick-cyan {
          background: linear-gradient(135deg, #0ea5e9, #0284c7);
          color: #ffffff;
        }
        .brick-magenta {
          background: linear-gradient(135deg, #e879f9, #c026d3);
          color: #ffffff;
        }
        .brick-silver {
          background: linear-gradient(135deg, #94a3b8, #475569);
          color: #ffffff;
          border-color: #e2e8f0;
        }
        .brick-emerald {
          background: linear-gradient(135deg, #10b981, #047857);
          color: #ffffff;
        }
        .brick-gold {
          background: linear-gradient(135deg, #f59e0b, #b45309);
          color: #fffbeb;
          border: 2px solid #fde68a;
        }
        .brick-shield {
          background: linear-gradient(135deg, #6366f1, #4338ca);
          color: #e0e7ff;
        }
        .brick-pylon {
          background: linear-gradient(135deg, #ec4899, #be185d);
          color: #fce7f3;
        }
        .brick-boss {
          background: linear-gradient(135deg, #ef4444, #7f1d1d);
          color: #fef2f2;
          border: 2px solid #fca5a5;
          flex-direction: column;
          gap: 3px;
          font-size: 12px;
          box-shadow: 0 0 18px rgba(239, 68, 68, 0.45);
        }
        .popup {
          position: absolute;
          font-size: 11px;
          font-weight: 900;
          color: var(--amber-accent);
          pointer-events: none;
          z-index: 18;
          opacity: 0;
        }
        .paddle {
          position: absolute;
          top: 348px;
          left: 0;
          height: 14px;
          border-radius: 7px;
          background: linear-gradient(90deg, var(--magenta-accent), var(--cyan-accent), var(--magenta-accent));
          border: 1.5px solid #ffffff;
          box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 8px;
          font-weight: 800;
          color: #ffffff;
          z-index: 15;
          animation: paddleMove 4s infinite ease-in-out;
        }
        .ball {
          position: absolute;
          top: 0;
          left: 0;
          width: 12px;
          height: 12px;
          margin-left: -6px;
          margin-top: -6px;
          border-radius: 50%;
          background: #ffffff;
          border: 2.5px solid var(--cyan-accent);
          box-shadow: 0 0 10px var(--cyan-accent);
          z-index: 16;
          animation: ballPath 4s infinite linear;
        }
        .impact-flash {
          position: absolute;
          width: 28px;
          height: 28px;
          margin-left: -14px;
          margin-top: -14px;
          border-radius: 50%;
          border: 2px solid var(--amber-accent);
          background: rgba(251, 191, 36, 0.35);
          z-index: 14;
          animation: impactPulse 4s infinite ease-out;
        }
        @keyframes impactPulse {
          0%, 10% { transform: scale(0.2); opacity: 0; }
          12% { transform: scale(1.35); opacity: 1; }
          20%, 100% { transform: scale(2.1); opacity: 0; }
        }
        .radar-target {
          position: absolute;
          top: 300px;
          width: 112px;
          margin-left: -56px;
          padding: 4px 6px;
          border-radius: 6px;
          border: 1.5px dashed var(--amber-accent);
          background: rgba(245, 158, 11, 0.12);
          color: var(--amber-accent);
          font-size: 9px;
          font-weight: 800;
          text-align: center;
          z-index: 12;
          animation: radarPulse 4s infinite ease-in-out;
        }
        @keyframes radarPulse {
          0%, 68% { opacity: 0; transform: translateY(-6px); }
          75%, 95% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(4px); }
        }
        .banner {
          position: absolute;
          left: 50%;
          top: 238px;
          transform: translateX(-50%);
          padding: 7px 16px;
          border-radius: 8px;
          border: 1px solid var(--border-frame);
          background: var(--bg-outer);
          text-align: center;
          z-index: 19;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
          animation: bannerFade 4s infinite ease-in-out;
        }
        .banner-title {
          font-size: 11px;
          font-weight: 900;
          letter-spacing: 0.06em;
          color: var(--cyan-accent);
        }
        .banner-sub {
          font-size: 9px;
          color: var(--text-muted);
          margin-top: 2px;
        }
        @keyframes bannerFade {
          0%, 62% { opacity: 0; transform: translate(-50%, 6px); }
          72%, 96% { opacity: 0.96; transform: translate(-50%, 0); }
          100% { opacity: 0; transform: translate(-50%, -4px); }
        }
        .sector-bar {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          height: 26px;
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          border-top: 1px solid var(--border-frame);
          background: rgba(15, 23, 42, 0.05);
          font-size: 9px;
          font-weight: 700;
          z-index: 20;
        }
        .sector-cell {
          display: flex;
          align-items: center;
          justify-content: center;
          border-right: 1px solid var(--border-frame);
          color: var(--text-muted);
        }
        .sector-cell:last-child {
          border-right: none;
        }
        .sector-active {
          color: var(--amber-accent);
          font-weight: 900;
          background: rgba(245, 158, 11, 0.12);
        }
        .laser-beam {
          position: absolute;
          width: 3px;
          height: 180px;
          background: linear-gradient(180deg, #fbbf24, #ef4444, transparent);
          z-index: 13;
          animation: laserFire 4s infinite ease-out;
        }
        @keyframes laserFire {
          0%, 14% { opacity: 0; transform: translateY(80px) scaleY(0.2); }
          18%, 36% { opacity: 1; transform: translateY(-90px) scaleY(1); }
          45%, 100% { opacity: 0; transform: translateY(-160px) scaleY(0.1); }
        }
    

        @keyframes paddleMove {
          0% { transform: translateX(48.0px); }
          10%, 68% { transform: translateX(420.0px); }
          92%, 100% { transform: translateX(420.0px); }
        }
    
        @keyframes ballPath {
          0.00% { transform: translate(420.0px, 195.0px); }
          12.00% { transform: translate(464.0px, 348.0px); }
          66.79% { transform: translate(588.0px, 158.0px); }
          75.00% { transform: translate(588.0px, 124.0px); }
          90.00% { transform: translate(464.0px, 316.0px); }
          100.00% { transform: translate(464.0px, 328.0px); }
        }

        .b-5 { animation: shatter_5 4s infinite ease-out; }
        @keyframes shatter_5 {
          0%, 50.8% { opacity: 1; transform: scale(1); filter: brightness(1); }
          52.0% { opacity: 1; transform: scale(1.12); filter: brightness(2.5); }
          57.5%, 100% { opacity: 0; transform: scale(0.15) translateY(-10px); }
        }
                    
        .p-5 { animation: popup_5 4s infinite ease-out; }
        @keyframes popup_5 {
          0%, 50.8% { opacity: 0; transform: translateY(4px); }
          53.5% { opacity: 1; transform: translateY(-6px); }
          70.0%, 100% { opacity: 0; transform: translateY(-18px); }
        }
                
        .b-6 { animation: shatter_6 4s infinite ease-out; }
        @keyframes shatter_6 {
          0%, 26.8% { opacity: 1; transform: scale(1); filter: brightness(1); }
          28.0% { opacity: 1; transform: scale(1.12); filter: brightness(2.5); }
          33.5%, 100% { opacity: 0; transform: scale(0.15) translateY(-10px); }
        }
                    
        .p-6 { animation: popup_6 4s infinite ease-out; }
        @keyframes popup_6 {
          0%, 26.8% { opacity: 0; transform: translateY(4px); }
          29.5% { opacity: 1; transform: translateY(-6px); }
          46.0%, 100% { opacity: 0; transform: translateY(-18px); }
        }
                
      </style>
      <div class="cabinet">
        <div class="crt">
          <div class="scanlines"></div>
          <div class="hud">
            <div class="hud-group">
              <span class="hud-pill">STAGE 03: DOH CORE</span>
              <span class="hud-pill">RALLY 3.2 // BARRIER DEFLECT</span>
            </div>
            <div class="hud-group">
              <span>SCORE</span>
              <span class="hud-pill hud-score-wrap">
                <span class="score-before">004100</span>
                <span class="score-after">004600</span>
              </span>
              <span class="hud-pill">VAUS: ♥♥♥ (LASER)</span>
            </div>
          </div>
          <div class="wall-left"></div>
          <div class="wall-right"></div>
          <svg width="664" height="404" viewBox="0 0 664 404" style="position:absolute;inset:0;pointer-events:none;z-index:4;">
            <polyline points="464.0,348.0 588.0,158.0 588.0,124.0 464.0,316.0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.32" />
          </svg>
        <div class="brick brick-boss b-0" style="left:244px;top:76px;width:192px;height:74px;">👁️ DOH CORE [HP: 2/3]</div>
        <div class="brick brick-shield b-4" style="left:528px;top:78px;width:116px;height:24px;">SHIELD-R1 [250]</div>
        <div class="brick brick-shield b-5" style="left:528px;top:112px;width:116px;height:24px;">SHIELD-R2 [250]</div>
        <div class="brick brick-pylon b-6" style="left:528px;top:146px;width:116px;height:24px;">LASER-PYL-R [250]</div>
        <div class="popup p-5" style="left:568px;top:106px;">+250</div>
        <div class="popup p-6" style="left:568px;top:140px;">+250</div>
        <div class="laser-beam" style="left:434px;top:170px;"></div>
        <div class="laser-beam" style="left:491px;top:170px;"></div>
          <div class="impact-flash" style="left:464px;top:350px;"></div>
          <div class="paddle" style="width:88px;">VAUS [LASER]</div>
          <div class="ball"></div>
        <div class="radar-target" style="left:464px;">▼ NEXT AIM: SECTOR 4 ▼</div>
          <div class="banner">
            <div class="banner-title">RIGHT BARRIER DEFLECT (+500 PTS)</div>
            <div class="banner-sub">Cleared PYL-R &amp; SH-R2 — Fire Laser Salvo from SECTOR 4 to crack SH-R1 &amp; DOH</div>
          </div>
          <div class="sector-bar">
          <div class="sector-cell">SECTOR 1</div>
          <div class="sector-cell">SECTOR 2</div>
          <div class="sector-cell">SECTOR 3</div>
          <div class="sector-cell sector-active">SECTOR 4 ★</div>
          <div class="sector-cell">SECTOR 5</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
