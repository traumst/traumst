<svg fill="none" viewBox="0 0 680 210" width="680" height="210" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .marquee {
          width: 680px;
          height: 210px;
          background: linear-gradient(135deg, #060913 0%, #0f172a 55%, #1e1b4b 100%);
          color: #f8fafc;
          border: 2px solid #38bdf8;
          border-radius: 14px;
          padding: 18px 24px;
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
        }
        .top-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .pill {
          display: inline-block;
          background: rgba(56, 189, 248, 0.14);
          color: #38bdf8;
          border: 1px solid #38bdf8;
          border-radius: 999px;
          padding: 4px 12px;
          font-size: 11px;
          font-weight: 800;
          letter-spacing: 0.06em;
        }
        .title {
          font-size: 25px;
          font-weight: 900;
          letter-spacing: 0.08em;
          text-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
          margin-top: 4px;
        }
        .subtitle {
          font-size: 12px;
          color: #94a3b8;
          margin-top: 4px;
        }
        .demo-strip {
          height: 54px;
          border-radius: 10px;
          border: 1px solid #38bdf8;
          background: rgba(15, 23, 42, 0.48);
          position: relative;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
        }
        .demo-bricks {
          display: flex;
          gap: 6px;
        }
        .mini-brick {
          width: 34px;
          height: 14px;
          border-radius: 3px;
          background: linear-gradient(135deg, #38bdf8, #0284c7);
          animation: brickPulse 2.4s infinite ease-in-out;
        }
        .mini-brick.alt {
          background: linear-gradient(135deg, #f472b6, #c026d3);
          animation-delay: 0.6s;
        }
        .mini-ball {
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #fbbf24;
          box-shadow: 0 0 8px #fbbf24;
          animation: attractBall 3.2s infinite ease-in-out;
        }
        .radar-call {
          font-size: 11px;
          font-weight: 800;
          color: #f59e0b;
          letter-spacing: 0.04em;
        }
        @keyframes brickPulse {
          0%, 100% { transform: scale(1); opacity: 0.9; }
          50% { transform: scale(1.06); opacity: 1; }
        }
        @keyframes attractBall {
          0%, 100% { left: 195px; top: 22px; }
          50% { left: 365px; top: 14px; }
        }
      </style>
      <div class="marquee">
        <div>
          <div class="top-row">
            <span class="pill">🕹️ ZERO-RELOAD IN-PROFILE ARCADE ENGINE</span>
            <span class="pill">DARK CRT CABINET MODE</span>
          </div>
          <div class="title">ARKANOID // VAUS BREAKOUT</div>
          <div class="subtitle">100% Self-Contained 3-Stage Campaign Inside README.md — Zero Page Reloads, Zero External Servers</div>
        </div>
        <div class="demo-strip">
          <div class="demo-bricks">
            <div class="mini-brick"></div>
            <div class="mini-brick alt"></div>
            <div class="mini-brick"></div>
            <div class="mini-brick alt"></div>
          </div>
          <div class="mini-ball"></div>
          <div class="radar-call">⚡ STAGE 01 SERVE LOCKED: AIM AT SECTOR 2 BELOW ▼</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
