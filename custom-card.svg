<svg fill="none" viewBox="0 0 680 140" width="680" height="140" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .card {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
          color: #e6edf3;
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 20px 24px;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 140px;
        }
        .badge {
          display: inline-block;
          background: rgba(56, 139, 253, 0.15);
          color: #58a6ff;
          border: 1px solid rgba(56, 139, 253, 0.4);
          border-radius: 999px;
          padding: 4px 12px;
          font-size: 12px;
          font-weight: 600;
          margin-bottom: 8px;
        }
        .title {
          font-size: 18px;
          font-weight: 700;
          margin: 0 0 6px 0;
        }
        .desc {
          font-size: 13px;
          color: #8b949e;
          margin: 0;
        }
        .pulse {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          background: #238636;
          animation: glow 2s infinite ease-in-out;
          flex-shrink: 0;
        }
        @keyframes glow {
          0%, 100% { transform: scale(0.92); opacity: 0.75; }
          50% { transform: scale(1.08); opacity: 1; }
        }
      </style>
      <div class="card">
        <div>
          <span class="badge">SVG foreignObject Loophole</span>
          <div class="title">Custom HTML &amp; CSS Animations Inside a GitHub README</div>
          <p class="desc">Saved as custom-card.svg and loaded via &lt;img src="./custom-card.svg"&gt; so GitHub keeps all CSS intact.</p>
        </div>
        <div class="pulse"></div>
      </div>
    </div>
  </foreignObject>
</svg>
